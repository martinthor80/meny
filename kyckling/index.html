<!doctype html>
<html lang="sv">
<head>
  <link rel="stylesheet" href="../style.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kycklingrecept</title>
<style>
  .btn-space {
    display: flex;
    align-items: center;
    gap: 15px;
  }
  .add-btn {
    background: #f4efe9;
    border: none;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    color: #29251f;
  }
  .add-btn:hover { background: #8b7d6b; color: white; }
</style>
</head>
<body>

<div class="container">
  
  <a href="../" class="back">← Tillbaka</a>

  <h1>Kyckling</h1>

  <div class="recipes-section">
    <ul class="recipe-list">
      
      <!-- DITT KORT I EXAKT ORIGINALDESIGN -->
      <li>
        <a href="kyckling-teriyaki-pak-choi.html">
          <span>Kyckling teriyaki med pak choi sallad</span>
          <span class="btn-space">
            <span>⭐⭐⭐⭐⭐</span>
            <button class="add-btn" onclick="event.preventDefault(); selectRecipe('kyckling-teriyaki-pak-choi.html', 'Kyckling teriyaki med pak choi sallad')">＋</button>
          </span>
        </a>
      </li>

    </ul>
  </div>
</div>

<script>
  async function selectRecipe(filename, title) {
    let chosenRecipes = JSON.parse(localStorage.getItem('chosenRecipes')) || [];
    let shoppingList = JSON.parse(localStorage.getItem('shoppingList')) || [];
    const fullUrl = 'kyckling/' + filename;

    if (chosenRecipes.some(r => r.url === fullUrl)) {
      alert("Det här receptet är redan valt!");
      return;
    }

    chosenRecipes.push({ url: fullUrl, title: title });
    localStorage.setItem('chosenRecipes', JSON.stringify(chosenRecipes));

    try {
      const response = await fetch(filename);
      const htmlText = await response.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlText, 'text/html');
      const ingredientElements = doc.querySelectorAll('ul li');
      
      ingredientElements.forEach(el => {
        const text = el.textContent.trim();
        if (text && !text.toLowerCase().includes('skriv ut') && !shoppingList.some(item => item.text === text)) {
          shoppingList.push({ text: text, checked: false });
        }
      });

      localStorage.setItem('shoppingList', JSON.stringify(shoppingList));
      alert('Recept tillagt och ingredienser hämtade!');
    } catch (error) {
      console.error(error);
    }
  }
</script>

</body>
</html>
